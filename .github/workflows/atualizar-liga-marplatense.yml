name: Atualizar Liga Marplatense (El Marplatense) - diário

on:
  schedule:
    # A programacao da fecha sai entre quinta e sexta; duas rodadas por dia
    # pegam remarcacoes de ultima hora (chuva).
    - cron: "15 13,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_liga_marplatense:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar scraper
        run: |
          python scrap_liga_marplatense.py --meses 2 --dias-atras 14

      - name: Salvar arquivos atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p /tmp/dados_novos
          cp data/debug_liga_marplatense_raw.json data/debug_liga_marplatense_artigos.json /tmp/dados_novos/ 2>/dev/null || true

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/dados_novos/*.json data/ 2>/dev/null || true
            if [ -f data/debug_liga_marplatense_raw.json ]; then
              python merge_apos_reset.py --raw data/debug_liga_marplatense_raw.json
            fi

            git add data/jogos_programados.csv data/jogos_programados.json data/historico_jogos.csv
            git add data/debug_liga_marplatense_raw.json data/debug_liga_marplatense_artigos.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Sem mudanças para commitar"
              break
            fi

            git commit -m "Atualiza jogos Liga Marplatense - diario"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $tentativa"
              break
            fi

            echo "Push falhou (tentativa $tentativa), tentando de novo..."
            sleep $((RANDOM % 10 + 5))
          done
