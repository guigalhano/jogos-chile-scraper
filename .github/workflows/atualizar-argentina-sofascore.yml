name: Atualizar Argentina (SofaScore - todas as competicoes) - diário

on:
  # O SofaScore devolve 403 para o GitHub Actions: a rodada diaria e feita no PC
  # (rodar_sofascore_local.ps1, Agendador de Tarefas). Aqui so manual.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_argentina_sofascore:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar scraper
        run: |
          python scrap_argentina_sofascore.py --dias 60 --dias-atras 7

      - name: Salvar arquivos atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p /tmp/dados_novos
          cp data/debug_argentina_sofascore_raw.json data/debug_argentina_sofascore_hist_raw.json data/debug_argentina_sofascore_eventos.json /tmp/dados_novos/ 2>/dev/null || true
          mkdir -p /tmp/dados_novos/argentina
          cp data/argentina/*.json /tmp/dados_novos/argentina/ 2>/dev/null || true

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Re-mescla so os raw desta rodada contra o estado ATUAL pos-reset
            # (ver merge_apos_reset.py) e tira os jogos que a AFA tambem publica.
            cp /tmp/dados_novos/debug_argentina_sofascore_*.json data/ 2>/dev/null || true
            mkdir -p data/argentina
            # caches de venue, cidades do Regional e geocodificacao
            cp /tmp/dados_novos/argentina/*.json data/argentina/ 2>/dev/null || true
            python merge_apos_reset.py --raw data/debug_argentina_sofascore_raw.json --raw-historico data/debug_argentina_sofascore_hist_raw.json
            python argentina_comum.py --dedupe

            git add data/jogos_programados.csv data/jogos_programados.json data/historico_jogos.csv
            git add data/argentina/ data/debug_argentina_sofascore_raw.json data/debug_argentina_sofascore_hist_raw.json data/debug_argentina_sofascore_eventos.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Sem mudanças para commitar"
              break
            fi

            git commit -m "Atualiza jogos Argentina (SofaScore) - diario"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $tentativa"
              break
            fi

            echo "Push falhou (tentativa $tentativa), tentando de novo..."
            sleep $((RANDOM % 10 + 5))
          done
