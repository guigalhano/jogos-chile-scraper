name: Atualizar Reino Unido nao-liga (NonLeagueHQ) - diário

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_nonleaguehq:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar scraper
        run: |
          python scrap_nonleaguehq.py --dias 270 --dias-atras 15

      - name: Geocodificar times novos para o mapa (Nominatim, 1 req/s)
        run: |
          python geocodificar_reino_unido.py --max-consultas 300

      - name: Salvar arquivos atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p /tmp/dados_novos
          cp data/debug_nonleaguehq_raw.json data/debug_nonleaguehq_hist_raw.json data/debug_nonleaguehq_pages.json /tmp/dados_novos/ 2>/dev/null || true
          mkdir -p /tmp/geo_novo
          cp data/reino_unido/geo_times.json data/reino_unido/cache_geocoding.json /tmp/geo_novo/ 2>/dev/null || true

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Os jogos do Reino Unido ficam em data/reino_unido/ (fora do
            # jogos_programados.json do site). Re-mescla os raw desta rodada
            # contra o estado ATUAL pos-reset, como o merge_apos_reset.py faz.
            cp /tmp/dados_novos/* data/ 2>/dev/null || true
            # Arquivos de coordenadas so este workflow escreve: copia direto.
            mkdir -p data/reino_unido
            cp /tmp/geo_novo/* data/reino_unido/ 2>/dev/null || true
            python reino_unido_comum.py --raw data/debug_nonleaguehq_raw.json --raw-historico data/debug_nonleaguehq_hist_raw.json
            # Nome das ligas pelos confrontos (Escocia) + remove versoes com nome antigo.
            python migrar_ligas_nlhq_confrontos.py

            git add data/reino_unido/ data/debug_nonleaguehq_raw.json data/debug_nonleaguehq_hist_raw.json data/debug_nonleaguehq_pages.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Sem mudanças para commitar"
              break
            fi

            git commit -m "Atualiza jogos Reino Unido nao-liga (NonLeagueHQ) - diario"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $tentativa"
              break
            fi

            echo "Push falhou (tentativa $tentativa), tentando de novo..."
            sleep $((RANDOM % 10 + 5))
          done
