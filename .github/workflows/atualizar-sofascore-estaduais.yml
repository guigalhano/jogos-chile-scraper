name: Atualizar Estaduais via SofaScore (MA, MS) - diário

on:
  schedule:
    - cron: "10 12 * * *"  # todo dia, logo apos o job de Goias
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_sofascore_estaduais:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar scraper Estaduais via SofaScore (Maranhão, Mato Grosso do Sul)
        run: |
          python scrap_sofascore_estaduais.py --dias 365 --dias-atras 45

      - name: Salvar arquivos atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p /tmp/dados_novos
          cp data/debug_sofascore_estaduais_raw.json data/debug_sofascore_estaduais_hist_raw.json /tmp/dados_novos/ 2>/dev/null || true
          cp data/debug_sofascore_estaduais_eventos.json /tmp/dados_novos/ 2>/dev/null || true

          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/dados_novos/*.json data/ 2>/dev/null || true
            if [ -f data/debug_sofascore_estaduais_raw.json ]; then
              python merge_apos_reset.py \
                --raw data/debug_sofascore_estaduais_raw.json \
                --raw-historico data/debug_sofascore_estaduais_hist_raw.json
            fi

            git add data/jogos_programados.csv data/jogos_programados.json data/historico_jogos.csv 2>/dev/null || true
            git add data/debug_sofascore_estaduais_raw.json data/debug_sofascore_estaduais_hist_raw.json data/debug_sofascore_estaduais_eventos.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Sem mudanças para commitar"
              break
            fi

            git commit -m "Atualiza jogos Estaduais via SofaScore (MA, MS) - diario"

            if git push origin HEAD:main; then
              echo "Push OK na tentativa $tentativa"
              break
            fi

            echo "Push falhou (tentativa $tentativa), tentando de novo..."
            sleep $((RANDOM % 10 + 5))
          done
